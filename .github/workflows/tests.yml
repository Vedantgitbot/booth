name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    # 3.15 can't turn the build red until it has run clean once; remove this line then.
    continue-on-error: ${{ matrix.python-version == '3.15' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install boothpy (editable, with dev deps)
        run: pip install -e ".[dev]"

      # Optional: lets the numpy-specific tests run instead of skipping.
      # A missing wheel (for example on a Python prerelease) must not fail the job.
      - name: Install numpy (optional)
        run: pip install numpy
        continue-on-error: true

      - name: Run tests
        run: pytest -v

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mypy runs on a current supported interpreter while checking code that
      # remains compatible with BOOTH's minimum Python version, 3.9.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install boothpy (editable, with typecheck deps)
        run: pip install -e ".[typecheck]"

      - name: Run mypy
        run: mypy src/booth/
