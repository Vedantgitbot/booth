[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boothpy"
version = "0.5.6"
description = "A lightweight, provider-agnostic checkpoint layer for trusting AI system outputs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vedant Brahmbhatt" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.19,<2.0"]

[project.urls]
Homepage = "https://github.com/Vedantgitbot/booth"
Repository = "https://github.com/Vedantgitbot/booth"
Documentation = "https://github.com/Vedantgitbot/booth/blob/main/TUTORIAL.md"
Changelog = "https://github.com/Vedantgitbot/booth/blob/main/CHANGELOG.md"
Issues = "https://github.com/Vedantgitbot/booth/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
booth = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Run mypy on Python 3.12 in CI while checking compatibility with BOOTH's
# minimum supported Python version.
python_version = "3.9"
